  </div>
  <script src="https://embed.cloudflarestream.com/embed/sdk.latest.js"></script>
  <script>
    // Browsers only allow fullscreen from a user gesture, so the first
    // tap/click starts playback AND enters fullscreen in one go.
    const wrap = document.getElementById('wrap');
    const tap = document.getElementById('tap');
    const player = Stream(document.getElementById('stream-player'));
    tap.addEventListener('click', () => {
      tap.remove();                       // hand control back to the player UI
      const pb=document.getElementById('playbtn'); if(pb) pb.remove();
      const el = wrap;
      const fs = el.requestFullscreen || el.webkitRequestFullscreen;
      try { fs && fs.call(el); } catch (e) {}
      try { player.controls = true; } catch (e) {}   // show normal controls once playing
      player.play();
    }, { once: true });
  </script>
